
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สอบวิชาคณิตศาสตร์ ป.5 เรื่องจำนวนคละ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:Tahoma,sans-serif}
main{max-width:760px;margin:auto;padding:18px}
header,.card{background:white;border-radius:18px;padding:22px;margin:12px 0;box-shadow:0 4px 16px #1231}
header{background:#e7f0ff;color:#1c427b;text-align:center}
h1{font-size:26px;margin:5px}
button{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid #ccd5e2;background:white;cursor:pointer}
.primary{background:#174ea6;color:white;border-color:#174ea6}
.choice{display:flex;gap:10px;padding:13px;border:1px solid #d5deea;border-radius:12px;margin:9px 0;cursor:pointer}
.choice:has(input:checked){background:#edf4ff;border-color:#174ea6}
.choice input{margin-top:5px}
.muted{color:#667085}
.feedback{padding:12px;border-radius:10px;margin:12px 0;line-height:1.7}
.ok{background:#e5f7eb;color:#176536}
.no{background:#fff0ed;color:#9d2b1c}
.hidden{display:none}
.bar{height:8px;background:#e5eaf2;border-radius:9px;overflow:hidden;margin-top:12px}
.bar span{display:block;height:100%;background:#2874d0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
#review p{line-height:1.7;border-bottom:1px solid #eee;padding-bottom:8px}
@media(max-width:500px){main{padding:10px}.card,header{padding:16px}}
</style>
</head>
<body>
<main>
<header><h1>สอบวิชาคณิตศาสตร์ ป.5 เรื่องจำนวนคละ</h1></header>

<section id="intro" class="card">
<p>ข้อสอบ 30 ข้อ · ตัวเลือก 4 ตัวเลือก</p>
<p class="muted">ตอบทีละข้อ ระบบจะแจ้งผลหลังตอบ และสรุปคะแนนเมื่อทำครบ</p>
<button class="primary" id="start">เริ่มทำข้อสอบ</button>
</section>

<section id="exam" class="card hidden">
<div class="row"><span id="count"></span><span id="points" class="muted"></span></div>
<div class="bar"><span id="progress" style="width:0"></span></div>
<h2 id="question"></h2>
<form id="form">
<div id="options"></div>
<div id="feedback" class="feedback hidden" aria-live="polite"></div>
<button id="submit" class="primary">ส่งคำตอบ</button>
</form>
</section>

<section id="result" class="card hidden">
<h2>สรุปคะแนน</h2>
<p id="score"></p>
<h3>เฉลยและคำอธิบาย</h3>
<div id="review"></div>
<button class="primary" onclick="location.reload()">ทำข้อสอบอีกครั้ง</button>
<p><a href="../index.html">กลับหน้าหลัก</a></p>
</section>
</main>

<script>
const questions = [
["1 1/2 เขียนเป็นเศษเกินได้ข้อใด",["2/2","3/2","2/3","3/3"],1,"1×2+1=3 จึงได้ 3/2"],
["2 1/3 เขียนเป็นเศษเกินได้ข้อใด",["5/3","6/3","7/3","3/7"],2,"2×3+1=7 จึงได้ 7/3"],
["7/4 เขียนเป็นจำนวนคละได้ข้อใด",["1 1/4","1 3/4","2 1/4","3 1/4"],1,"7÷4 ได้ 1 เศษ 3 จึงเป็น 1 3/4"],
["11/5 เขียนเป็นจำนวนคละได้ข้อใด",["1 1/5","2 1/5","2 2/5","3 1/5"],1,"11÷5 ได้ 2 เศษ 1"],
["3 2/7 เขียนเป็นเศษเกินได้ข้อใด",["21/7","23/7","25/7","17/7"],1,"3×7+2=23 จึงได้ 23/7"],
["13/6 เขียนเป็นจำนวนคละได้ข้อใด",["1 7/6","2 1/6","2 3/6","3 1/6"],1,"13÷6 ได้ 2 เศษ 1"],
["1 3/4 อ่านได้ตรงกับข้อใด",["หนึ่งเศษสามส่วนสี่","สามเศษหนึ่งส่วนสี่","หนึ่งเศษสี่ส่วนสาม","สี่เศษหนึ่งส่วนสาม"],0,"อ่านว่า หนึ่งเศษสามส่วนสี่"],
["ข้อใดมีค่ามากที่สุด",["1 1/2","1 3/4","1 1/4","1 2/5"],1,"1 3/4 มีค่ามากที่สุด"],
["ข้อใดมีค่าน้อยที่สุด",["2 1/3","2 1/2","2 1/6","2 3/4"],2,"เมื่อจำนวนเต็มเท่ากัน 1/6 มีค่าน้อยที่สุด"],
["2 1/4 + 1/4 เท่ากับเท่าใด",["2 1/4","2 1/2","3","3 1/2"],1,"1/4+1/4=2/4=1/2 จึงได้ 2 1/2"],
["1 2/5 + 2/5 เท่ากับเท่าใด",["1 4/5","2 1/5","1 3/5","2"],0,"2/5+2/5=4/5 จึงได้ 1 4/5"],
["3 3/8 - 1/8 เท่ากับเท่าใด",["3 2/8","3 1/4","2 1/8","3 4/8"],1,"3/8-1/8=2/8=1/4"],
["4 1/6 - 2/6 เท่ากับเท่าใด",["4 3/6","3 5/6","3 1/2","4 1/3"],1,"ยืม 1 จาก 4 เป็น 3 7/6 แล้วลบได้ 3 5/6"],
["มีแป้ง 2 1/2 กก. ใช้ไป 1/2 กก. เหลือเท่าใด",["1 1/2 กก.","2 กก.","2 1/2 กก.","3 กก."],1,"2 1/2-1/2=2 กก."],
["ริบบิ้นยาว 1 3/4 เมตร ซื้อเพิ่ม 1/4 เมตร รวมเท่าใด",["1 1/2 เมตร","2 เมตร","2 1/4 เมตร","1 4/8 เมตร"],1,"3/4+1/4=1 จึงรวมเป็น 2 เมตร"],
["จำนวนคละ 5 2/3 ประกอบด้วยข้อใด",["5 และ 2/3","2 และ 5/3","5 และ 3/2","7 และ 2/3"],0,"มีจำนวนเต็ม 5 และเศษส่วน 2/3"],
["17/5 เขียนเป็นจำนวนคละได้ข้อใด",["2 2/5","3 2/5","3 1/5","4 2/5"],1,"17÷5 ได้ 3 เศษ 2"],
["2 4/5 เขียนเป็นเศษเกินได้ข้อใด",["10/5","12/5","14/5","15/5"],2,"2×5+4=14 จึงได้ 14/5"],
["เรียงจากน้อยไปมากข้อใดถูกต้อง",["1 3/4, 1 1/2, 1 1/4","1 1/4, 1 1/2, 1 3/4","1 1/2, 1 1/4, 1 3/4","1 1/4, 1 3/4, 1 1/2"],1,"เรียงเศษส่วนจาก 1/4, 1/2, 3/4"],
["เค้กมี 2 1/4 ถาด กินไป 3/4 ถาด เหลือเท่าใด",["1 1/2 ถาด","1 3/4 ถาด","2 ถาด","2 1/2 ถาด"],0,"2 1/4-3/4=1 1/2 ถาด"],
["2 2/5 + 1 1/5 เท่ากับเท่าใด",["3 3/5","3 1/5","4 3/5","2 3/5"],0,"2+1=3 และ 2/5+1/5=3/5"],
["4 3/7 - 1 2/7 เท่ากับเท่าใด",["3 1/7","2 1/7","3 5/7","4 1/7"],0,"4-1=3 และ 3/7-2/7=1/7"],
["19/4 เขียนเป็นจำนวนคละได้ข้อใด",["4 3/4","3 3/4","4 1/4","5 1/4"],0,"19÷4 ได้ 4 เศษ 3"],
["3 5/8 เขียนเป็นเศษเกินได้ข้อใด",["24/8","29/8","35/8","13/8"],1,"3×8+5=29"],
["ข้อใดมีค่ามากกว่า 2 1/2",["2 1/4","2 2/3","2 1/3","2 1/5"],1,"2/3 มากกว่า 1/2"],
["ข้อใดมีค่าน้อยที่สุด",["3 1/2","3 1/4","3 3/4","3 2/3"],1,"1/4 มีค่าน้อยที่สุด"],
["1 2/6 เขียนโดยย่อเศษส่วนให้ต่ำสุดได้ข้อใด",["1 1/3","1 2/3","1 1/2","1 3/6"],0,"2/6 หารด้วย 2 ได้ 1/3"],
["2 3/10 + 1 4/10 เท่ากับเท่าใด",["3 7/10","4 1/10","3 1/10","2 7/10"],0,"2+1=3 และ 3/10+4/10=7/10"],
["5 1/6 - 2 4/6 เท่ากับเท่าใด",["2 3/6","3 3/6","2 5/6","3 1/6"],0,"ยืม 1 ได้ 4 7/6-2 4/6=2 3/6"],
["มีเชือก 3 1/2 เมตร ใช้ไป 1 1/2 เมตร เหลือเท่าใด",["1 เมตร","2 เมตร","2 1/2 เมตร","3 เมตร"],1,"3 1/2-1 1/2=2 เมตร"]
];

let index=0, answers=[], locked=false;
const $=id=>document.getElementById(id);
const letters=["ก","ข","ค","ง"];

$("start").onclick=()=>{
  $("intro").classList.add("hidden");
  $("exam").classList.remove("hidden");
  draw();
};

function draw(){
  locked=false;
  const q=questions[index];
  $("count").textContent=`ข้อ ${index+1} / ${questions.length}`;
  $("points").textContent=`ตอบถูก ${answers.filter((a,j)=>a===questions[j][2]).length} ข้อ`;
  $("progress").style.width=((index+1)/questions.length*100)+"%";
  $("question").textContent=q[0];
  $("options").innerHTML="";
  q[1].forEach((text,j)=>{
    const label=document.createElement("label");
    label.className="choice";
    const radio=document.createElement("input");
    radio.type="radio";radio.name="answer";radio.value=j;
    const span=document.createElement("span");
    span.textContent=letters[j]+". "+text;
    label.append(radio,span);
    $("options").append(label);
  });
  $("feedback").className="feedback hidden";
  $("submit").textContent="ส่งคำตอบ";
}

$("form").onsubmit=e=>{
  e.preventDefault();
  if(!locked){
    const selected=document.querySelector('input[name="answer"]:checked');
    if(!selected){alert("กรุณาเลือกคำตอบก่อน");return;}
    answers[index]=Number(selected.value);
    locked=true;
    document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
    const q=questions[index],correct=answers[index]===q[2];
    $("feedback").className="feedback "+(correct?"ok":"no");
    $("feedback").textContent=(correct?"ถูกต้อง! ":"ยังไม่ถูกต้อง ")+
      "เฉลย: "+letters[q[2]]+". "+q[1][q[2]]+" — "+q[3];
    $("submit").textContent=index===questions.length-1?"ดูคะแนนรวม":"ข้อถัดไป";
    return;
  }
  if(index<questions.length-1){index++;draw();}
  else finish();
};

function finish(){
  const score=answers.filter((a,j)=>a===questions[j][2]).length;
  $("exam").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("score").innerHTML=`<strong style="font-size:24px">${score} / ${questions.length} คะแนน (${Math.round(score/questions.length*100)}%)</strong>`;
  $("review").innerHTML="";
  questions.forEach((q,j)=>{
    const p=document.createElement("p");
    p.textContent=`${j+1}. ${q[0]} — เฉลย ${letters[q[2]]}. ${q[1][q[2]]}. ${q[3]}`;
    $("review").append(p);
  });
}
</script>
</body>
</html>
