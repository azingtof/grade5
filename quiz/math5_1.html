<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อสอบวิชาคณิตศาสตร์ ชั้นประถมศึกษาปีที่ 5 (เทอม 1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .fraction {
      display: inline-grid;
      grid-template-rows: auto auto;
      vertical-align: middle;
      text-align: center;
      line-height: 1;
      font-size: .88em;
      margin: 0 .12em;
    }
    .fraction-numerator {
      border-bottom: 1px solid currentColor;
      padding: 0 .12em .1em;
    }
    .fraction-denominator { padding: .1em .12em 0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 flex flex-col items-center">

  <div class="w-full max-w-3xl bg-white shadow-md rounded-2xl p-6 md:p-8 border border-slate-200">
    <div class="border-b border-slate-200 pb-4 mb-6 text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-blue-700">ข้อสอบวิชาคณิตศาสตร์ ชั้นประถมศึกษาปีที่ 5 (เทอม 1)</h1>
      <p class="text-sm text-slate-500 mt-1">เนื้อหา: เศษส่วน ทศนิยม บัญญัติไตรยางศ์ และร้อยละ/เปอร์เซ็นต์ (30 ข้อ)</p>
    </div>

    <!-- Interactive Quiz Container -->
    <div id="quiz-container">
      <div class="flex justify-between items-center mb-4 text-sm font-semibold text-slate-600">
        <span id="question-tracker">ข้อที่ 1 / 30</span>
        <span id="score-tracker" class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full border border-blue-200">คะแนน: 0</span>
      </div>

      <div class="w-full bg-slate-100 rounded-full h-2.5 mb-6 overflow-hidden">
        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 3.33%"></div>
      </div>

      <div class="mb-6">
        <h2 id="question-text" class="text-lg md:text-xl font-semibold text-slate-800 leading-relaxed"></h2>
      </div>

      <div id="options-container" class="space-y-3 mb-6"></div>

      <!-- Feedback Section -->
      <div id="feedback-container" class="hidden rounded-xl p-4 mb-6 transition-all duration-200">
        <p id="feedback-status" class="font-bold text-base mb-1"></p>
        <p id="feedback-explanation" class="text-sm text-slate-700 leading-relaxed"></p>
      </div>

      <button id="next-btn" class="hidden w-full py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow transition duration-150">
        ข้อถัดไป
      </button>
    </div>

    <!-- Summary Container -->
    <div id="summary-container" class="hidden text-center py-6">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-100 text-blue-600 text-3xl font-bold mb-4">
        🏆
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-2">สรุปผลคะแนนการทำแบบทดสอบ</h2>
      <p id="final-score-text" class="text-xl text-blue-700 font-semibold mb-6"></p>

      <div class="flex flex-col sm:flex-row gap-3 justify-center mb-8">
        <button onclick="restartQuiz()" class="py-2.5 px-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow transition">
          ทำแบบทดสอบใหม่อีกครั้ง
        </button>
        <button onclick="toggleAnswerSheet()" class="py-2.5 px-6 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold rounded-xl border border-slate-300 transition">
          ดูเฉลยละเอียดครบ 30 ข้อ
        </button>
      </div>
    </div>

    <!-- Full Answer Key Sheet -->
    <div id="answer-sheet" class="mt-8 pt-6 border-t border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">เฉลยละเอียดและโจทย์ทั้งหมด 30 ข้อ</h3>
        <button id="toggle-sheet-btn" onclick="toggleAnswerSheet()" class="text-sm text-blue-600 hover:underline">
          ซ่อนเฉลย
        </button>
      </div>
      <div id="answers-list" class="space-y-4 text-sm"></div>
    </div>
  </div>

  <script>
    const questions = [

      },
      {
        q: "10. ข้อใดเขียนเศษส่วน 7/20 ในรูปทศนิยมได้ถูกต้อง",
        options: ["ก. 0.7", "ข. 0.07", "ค. 0.35", "ง. 0.035"],

      {

        options: ["ก. 2.1", "ข. 2.2", "ค. 2.25", "ง. 2.5"],
        correct: 2,

      },

        q: "23. สมุด 1 โหล (12 เล่ม) ราคา 180 บาท ถ้ามีเงิน 75 บาท จะซื้อสมุดได้กี่เล่ม",
        options: ["ก. 4 เล่ม", "ข. 5 เล่ม", "ค. 6 เล่ม", "ง. 7 เล่ม"],
        correct: 1,

      },
      {
        q: "24. ข้อใดเขียน 35% ในรูปร้อยละและเศษส่วนได้อย่างถูกต้อง",
        options: [
          "ก. ร้อยละ 35 และ 35/10",
          "ข. ร้อยละ 35 และ 7/20",
          "ค. ร้อยละ 3.5 และ 35/100",

        ],
        correct: 1,
        exp: "35% คือ ร้อยละ 35 เขียนเป็นเศษส่วนได้ 35/100 ทอนเป็นอย่างต่ำได้ 7/20"
      },

        correct: 1,

      },

      },
      {
        q: "29. ซื้อรองเท้าราคา 1,200 บาท ขายต่อขาดทุน 10% ขายรองเท้าไปได้เงินเท่าใด",
        options: ["ก. 1,080 บาท", "ข. 1,100 บาท", "ค. 1,120 บาท", "ง. 120 บาท"],
        correct: 0,

      },

        q: "30. ปริมาณน้ำผลไม้กล่องเดิมมี 250 มิลลิลิตร ผู้ผลิตเพิ่มปริมาณให้อีก 20% กล่องใหม่จะมีน้ำผลไม้กี่มิลลิลิตร",
        options: ["ก. 270 มิลลิลิตร", "ข. 280 มิลลิลิตร", "ค. 300 มิลลิลิตร", "ง. 320 มิลลิลิตร"],
        correct: 2,
        exp: "ปริมาณที่เพิ่ม = (20/100) × 250 = 50 มิลลิลิตร รวมเป็น 250 + 50 = 300 มิลลิลิตร"

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionTracker = document.getElementById('question-tracker');
    const scoreTracker = document.getElementById('score-tracker');
    const progressBar = document.getElementById('progress-bar');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackContainer = document.getElementById('feedback-container');
    const feedbackStatus = document.getElementById('feedback-status');
    const feedbackExplanation = document.getElementById('feedback-explanation');
    const nextBtn = document.getElementById('next-btn');

    const quizContainer = document.getElementById('quiz-container');
    const summaryContainer = document.getElementById('summary-container');
    const finalScoreText = document.getElementById('final-score-text');
    const answerSheet = document.getElementById('answer-sheet');
    const answersList = document.getElementById('answers-list');
    const toggleSheetBtn = document.getElementById('toggle-sheet-btn');

    function renderFractions(element, text) {
      element.replaceChildren();
      const fractionPattern = /(\d+)\/(\d+)/g;
      let lastIndex = 0;
      let match;

      while ((match = fractionPattern.exec(text)) !== null) {
        element.append(document.createTextNode(text.slice(lastIndex, match.index)));

        const fraction = document.createElement('span');
        fraction.className = 'fraction';
        const numerator = document.createElement('span');
        numerator.className = 'fraction-numerator';
        numerator.textContent = match[1];
        const denominator = document.createElement('span');
        denominator.className = 'fraction-denominator';
        denominator.textContent = match[2];
        fraction.append(numerator, denominator);
        element.appendChild(fraction);

        lastIndex = fractionPattern.lastIndex;
      }

      element.append(document.createTextNode(text.slice(lastIndex)));
    }

    function loadQuestion() {
      answered = false;
      feedbackContainer.classList.add('hidden');
      nextBtn.classList.add('hidden');

      const q = questions[currentQuestion];
      questionTracker.textContent = `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;
      scoreTracker.textContent = `คะแนน: ${score}`;
      progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      renderFractions(questionText, q.q);

      optionsContainer.innerHTML = '';
      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 border border-slate-200 rounded-xl hover:bg-blue-50 hover:border-blue-300 transition duration-150 text-slate-800 font-medium";
        renderFractions(btn, opt);
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      if (answered) return;
      answered = true;

      const q = questions[currentQuestion];
      const buttons = optionsContainer.querySelectorAll('button');

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
        if (idx === q.correct) {
          btn.className = "w-full text-left p-3.5 border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold rounded-xl";
        } else if (idx === selectedIndex) {
          btn.className = "w-full text-left p-3.5 border-2 border-rose-500 bg-rose-50 text-rose-900 font-semibold rounded-xl";
        } else {
          btn.className = "w-full text-left p-3.5 border border-slate-200 rounded-xl text-slate-400 bg-slate-50";
        }
      });

      const isCorrect = selectedIndex === q.correct;
      if (isCorrect) {
        score++;
        scoreTracker.textContent = `คะแนน: ${score}`;
        feedbackContainer.className = "rounded-xl p-4 mb-6 bg-emerald-50 border border-emerald-200 text-emerald-900 block";
        feedbackStatus.textContent = "✓ ถูกต้อง!";
      } else {
        feedbackContainer.className = "rounded-xl p-4 mb-6 bg-rose-50 border border-rose-200 text-rose-900 block";
        feedbackStatus.textContent = "✗ ยังไม่ถูกต้อง!";
      }

      renderFractions(feedbackExplanation, `คำอธิบาย: ${q.exp}`);
      nextBtn.classList.remove('hidden');

      if (currentQuestion === questions.length - 1) {
        nextBtn.textContent = "ดูผลคะแนนรวม";
      } else {
        nextBtn.textContent = "ข้อถัดไป";
      }
    }

    nextBtn.onclick = () => {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showSummary();
      }
    };

    function showSummary() {
      quizContainer.classList.add('hidden');
      summaryContainer.classList.remove('hidden');
      finalScoreText.textContent = `คุณทำคะแนนได้ ${score} จาก ${questions.length} คะแนน (${Math.round((score / questions.length) * 100)}%)`;
      renderAnswerKey();
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      summaryContainer.classList.add('hidden');
      quizContainer.classList.remove('hidden');
      loadQuestion();
    }

    function renderAnswerKey() {
      answersList.innerHTML = '';
      questions.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = "p-3 rounded-lg bg-slate-50 border border-slate-200";
        const question = document.createElement('p');
        question.className = "font-semibold text-slate-800";
        renderFractions(question, item.q);
        const answer = document.createElement('p');
        answer.className = "text-emerald-700 font-medium mt-1";
        renderFractions(answer, `เฉลย: ${item.options[item.correct]}`);
        const explanation = document.createElement('p');
        explanation.className = "text-slate-600 text-xs mt-0.5";
        renderFractions(explanation, `คำอธิบาย: ${item.exp}`);
        itemDiv.append(question, answer, explanation);
        answersList.appendChild(itemDiv);
      });
    }

    function toggleAnswerSheet() {
      if (answerSheet.classList.contains('hidden')) {
        answerSheet.classList.remove('hidden');
        toggleSheetBtn.textContent = "ซ่อนเฉลย";
      } else {
        answerSheet.classList.add('hidden');
        toggleSheetBtn.textContent = "แสดงเฉลย";
      }
    }

    // Initialize on load
    loadQuestion();
    renderAnswerKey();
  </script>
</body>
</html>
